[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-built-connector"
version = "0.1.0"
description = "Agent that reads API docs and generates a working connector with human-in-the-loop review"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.35.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "rich>=13.8.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[project.scripts]
connector-agent = "main:app"

[tool.hatch.build.targets.wheel]
packages = ["agent", "mock_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
